name: Claude Mention Support

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  claude:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Run Claude on mention
        uses: anthropics/claude-code-action@v1
