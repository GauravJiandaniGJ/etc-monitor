<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETC Monitor • Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <span>ETC Monitor</span>
            </div>
            <div class="header-right">
                <button id="bot-toggle-btn"
                    style="margin-right: 12px; padding: 6px 12px; background: var(--danger); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 6px;"
                    title="Pause Bot">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                    Pause Bot
                </button>
                <button id="trigger-eod-btn"
                    style="margin-right: 12px; padding: 6px 12px; background: var(--warning); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 6px;"
                    title="Trigger EOD Check">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    Trigger EOD
                </button>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" id="theme-icon">
                        <path
                            d="M10.41 13.28C7.332 10.205 6.716 5.693 8.357 2c-1.23.41-2.256 1.23-3.281 2.256a10.399 10.399 0 0 0 0 14.768c4.102 4.102 10.46 3.897 14.562-.205 1.026-1.026 1.846-2.051 2.256-3.282-3.896 1.436-8.409.82-11.486-2.256Z"
                            fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <div class="status-indicator" id="bot-status-indicator">
                    <div class="status-dot" id="bot-status-dot"></div>
                    <span id="bot-status-text">Bot Running</span>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">Total Reminders</span>
                        <div class="stat-icon primary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="20" x2="18" y2="10"></line>
                                <line x1="12" y1="20" x2="12" y2="4"></line>
                                <line x1="6" y1="20" x2="6" y2="14"></line>
                            </svg>
                        </div>
                    </div>
                    <div class="stat-value" id="total">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">Pending</span>
                        <div class="stat-icon warning">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                    </div>
                    <div class="stat-value" id="pending">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">Sent</span>
                        <div class="stat-icon success">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                    </div>
                    <div class="stat-value" id="sent">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">Cancelled</span>
                        <div class="stat-icon danger">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </div>
                    </div>
                    <div class="stat-value" id="cancelled">-</div>
                </div>
            </div>

            <div class="content-card">
                <div class="content-header">
                    <h2 class="content-title">Reminder Management</h2>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <div class="tabs">
                            <button class="tab active" onclick="showTab('all')">All Reminders</button>
                            <button class="tab" onclick="showTab('pending')">Pending Only</button>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <div id="all-tab">
                        <div id="loading" class="loading">Loading reminders...</div>
                        <div id="error" class="error" style="display:none;"></div>
                        <table class="data-table" id="remindersTable" style="display:none;">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Channel</th>
                                    <th>Message</th>
                                    <th>Deadline</th>
                                    <th>Reminder Time</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="remindersBody">
                            </tbody>
                        </table>
                    </div>
                    <div id="pending-tab" style="display:none;">
                        <div id="loading-pending" class="loading">Loading pending reminders...</div>
                        <table class="data-table" id="pendingTable" style="display:none;">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Channel</th>
                                    <th>Message</th>
                                    <th>Deadline</th>
                                    <th>Reminder Time</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="pendingBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>

</html>
