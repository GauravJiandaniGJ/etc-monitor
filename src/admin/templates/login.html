<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in • ETC Monitor</title>
    {% include '_theme_boot.html' %}
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    {% include '_icons.html' %}
    <main class="login-page">
        <div class="login-card">
            <h1 class="login-title">ETC Monitor</h1>
            <p class="login-subtitle">Sign in to manage reminders.</p>

            {% if error %}
            <div class="login-error" role="alert">
                <svg class="icon" aria-hidden="true"><use href="#i-warning"></use></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form class="login-form" method="POST" action="{{ url_for('login') }}">
                <label class="field" for="username">
                    <span class="field-label">Username</span>
                    <input type="text" id="username" name="username" class="field-input" value="{{ username or '' }}"
                        autocomplete="username" autocapitalize="none" spellcheck="false" required
                        {% if not username %}autofocus{% endif %}>
                </label>
                <label class="field" for="password">
                    <span class="field-label">Password</span>
                    <input type="password" id="password" name="password" class="field-input"
                        autocomplete="current-password" required {% if username %}autofocus{% endif %}>
                </label>
                <button type="submit" class="btn btn-primary login-submit">Sign in</button>
            </form>

            <p class="login-foot">Session lasts 7 days on this device.</p>
        </div>
    </main>
</body>

</html>
